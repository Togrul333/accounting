<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turu Düzenle — Hisar Tour</title>
  <link rel="stylesheet" href="/static/theme/assets/css/main.css">
</head>
<body>

{{template "topbar_v2" .}}
{{template "sidebar_v2" .}}

<main id="content" class="content py-10">
  <div class="container-fluid">

    <div class="row">
      <div class="col-12">
        <div class="d-flex align-items-center gap-3 mb-4">
          <a href="/tours" class="btn btn-icon btn-sm btn-light"><i class="ti ti-arrow-left"></i></a>
          <div>
            <h1 class="fs-3 mb-1">Turu Düzenle</h1>
            <p class="mb-0 text-secondary">{{.tour.Code}}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-6 col-12">
        <div class="card">
          <div class="card-body">
            <form id="editForm" onsubmit="saveTour(event)">
              <div class="mb-3">
                <label class="form-label">Tur Kodu <span class="text-danger">*</span></label>
                <input id="fCode" type="text" required class="form-control" value="{{.tour.Code}}">
              </div>
              <div class="row g-3 mb-3">
                <div class="col-6">
                  <label class="form-label">Başlangıç Tarihi <span class="text-danger">*</span></label>
                  <input id="fStart" type="date" required class="form-control" value="{{.tour.StartDate.Format "2006-01-02"}}">
                </div>
                <div class="col-6">
                  <label class="form-label">Bitiş Tarihi <span class="text-danger">*</span></label>
                  <input id="fEnd" type="date" required class="form-control" value="{{.tour.EndDate.Format "2006-01-02"}}">
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Tur Kategorisi <span class="text-danger">*</span></label>
                <select id="fCategory" required class="form-select">
                  <option value="">Seçin...</option>
                  {{range .categories}}
                  <option value="{{.ID}}" {{if eq .ID $.tour.TourCategoryID}}selected{{end}}>
                    {{.Name}} — {{printf "%.2f" .Price}} ₺
                  </option>
                  {{end}}
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Oda <span class="text-danger">*</span></label>
                <select id="fRoom" required class="form-select">
                  <option value="">Seçin...</option>
                  {{range .rooms}}
                  <option value="{{.ID}}" {{if eq .ID $.tour.RoomID}}selected{{end}}>
                    {{printf "%.2f" .Price}} ₺ / {{.BedsCount}} yatak
                  </option>
                  {{end}}
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Uçuşlar <span class="text-danger">*</span></label>
                <div class="border rounded-2 p-2 d-flex flex-column gap-1" style="max-height: 220px; overflow-y: auto;">
                  {{if .flights}}
                  {{range .flights}}
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="{{.ID}}" id="flight-{{.ID}}" {{if index $.selectedFlightIDs .ID}}checked{{end}}>
                    <label class="form-check-label small" for="flight-{{.ID}}">{{.PNR}} — {{.DepartureTime.Format "02.01.2006 15:04"}}</label>
                  </div>
                  {{end}}
                  {{else}}
                  <p class="small text-secondary mb-0">Önce bir uçuş ekleyin</p>
                  {{end}}
                </div>
                <div class="form-text">Birden fazla uçuş seçebilirsiniz.</div>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <a href="/tours" class="btn btn-outline-secondary">İptal</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<div id="toast" class="alert position-fixed d-none align-items-center gap-2" style="top:20px; right:20px; z-index:1080; min-width:260px;" role="alert"></div>

<script src="/static/theme/assets/js/main.js" type="module"></script>
<script>
  const tourId = {{.tour.ID}};

  async function saveTour(e) {
    e.preventDefault();
    const flightIds = Array.from(document.querySelectorAll('#editForm input[type=checkbox]:checked')).map(el => parseInt(el.value));
    if (!flightIds.length) {
      showToast('✕ En az bir uçuş seçmelisiniz', 'danger');
      return;
    }
    const payload = {
      code:             document.getElementById('fCode').value.trim(),
      start_date:       document.getElementById('fStart').value,
      end_date:         document.getElementById('fEnd').value,
      tour_category_id: parseInt(document.getElementById('fCategory').value),
      room_id:          parseInt(document.getElementById('fRoom').value),
      flight_ids:       flightIds,
    };
    try {
      const res = await fetch(`/api/tours/${tourId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (res.ok) {
        showToast('✓ Tur güncellendi', 'success');
        setTimeout(() => window.location.href = '/tours', 700);
      } else {
        const err = await res.json();
        showToast('✕ ' + (err.error || 'Bir hata oluştu'), 'danger');
      }
    } catch { showToast('✕ Sunucu bağlantı hatası', 'danger'); }
  }

  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'alert position-fixed d-flex align-items-center gap-2 alert-' + type;
    el.style.top = '20px';
    el.style.right = '20px';
    el.style.zIndex = 1080;
    el.style.minWidth = '260px';
    setTimeout(() => el.classList.add('d-none'), 2800);
  }
</script>
</body>
</html>
