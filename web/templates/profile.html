<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Hisar Tour</title>
  <link rel="stylesheet" href="/static/theme/assets/css/main.css">
</head>
<body>

{{template "topbar_v2" .}}
{{template "sidebar_v2" .}}

<main id="content" class="content py-10">
  <div class="container-fluid">

    <div class="row">
      <div class="col-12">
        <div class="mb-4">
          <h1 class="fs-3 mb-1">Profil</h1>
          <p class="mb-0 text-secondary">Hesap bilgileri</p>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-6 col-12">

        <!-- Avatar + isim -->
        <div class="card p-4 mb-3">
          <div class="d-flex align-items-center gap-3">
            <div class="d-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10 text-primary fw-bold fs-4"
                 style="width:56px;height:56px;">
              {{printf "%.1s" .user.Name}}
            </div>
            <div>
              <p class="fw-bold mb-0 fs-5">{{.user.Name}}</p>
              <p class="text-secondary mb-0">{{.user.Email}}</p>
            </div>
          </div>
        </div>

        <!-- Bilgiler -->
        <div class="card mb-3">
          <div class="card-header bg-transparent px-4 py-3">
            <h3 class="h6 mb-0">Kullanıcı Bilgileri</h3>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Ad Soyad</label>
              <input type="text" id="profile-name" class="form-control" value="{{.user.Name}}" placeholder="Ad Soyad">
            </div>
            <div class="mb-3">
              <label class="form-label">E-posta</label>
              <input type="email" id="profile-email" class="form-control" value="{{.user.Email}}" placeholder="E-posta">
            </div>
            <button type="button" class="btn btn-primary" onclick="saveProfile()">
              <i class="ti ti-check"></i> Kaydet
            </button>
          </div>
        </div>

        <!-- Şifre değiştir -->
        <div class="card">
          <div class="card-header bg-transparent px-4 py-3">
            <h3 class="h6 mb-0">Şifre Değiştir</h3>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Mevcut Şifre</label>
              <input type="password" id="pw-current" class="form-control" placeholder="••••••••">
            </div>
            <div class="mb-3">
              <label class="form-label">Yeni Şifre</label>
              <input type="password" id="pw-new" class="form-control" placeholder="••••••••">
            </div>
            <div class="mb-3">
              <label class="form-label">Yeni Şifre Tekrar</label>
              <input type="password" id="pw-confirm" class="form-control" placeholder="••••••••">
            </div>
            <button type="button" class="btn btn-primary" onclick="changePassword()">
              <i class="ti ti-lock"></i> Şifreyi Güncelle
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
</main>

<div id="toast" class="alert position-fixed d-none align-items-center gap-2" style="top:20px; right:20px; z-index:1080; min-width:260px;" role="alert"></div>

<script src="/static/theme/assets/js/main.js" type="module"></script>
<script>
function saveProfile() {
  var name  = document.getElementById('profile-name').value.trim();
  var email = document.getElementById('profile-email').value.trim();
  if (!name || !email) { showToast('Ad ve e-posta zorunlu', 'danger'); return; }

  fetch('/api/profile', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: name, email: email})
  }).then(function(r) {
    if (r.ok) showToast('✓ Profil güncellendi', 'success');
    else r.json().then(function(d) { showToast('✕ ' + (d.error || 'Hata'), 'danger'); });
  }).catch(function() { showToast('✕ Hata oluştu', 'danger'); });
}

function changePassword() {
  var current = document.getElementById('pw-current').value;
  var nw      = document.getElementById('pw-new').value;
  var confirm = document.getElementById('pw-confirm').value;
  if (!current || !nw) { showToast('Tüm alanları doldurun', 'danger'); return; }
  if (nw !== confirm)  { showToast('Şifreler eşleşmiyor', 'danger'); return; }

  fetch('/api/profile/password', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({current: current, new: nw})
  }).then(function(r) {
    if (r.ok) {
      showToast('✓ Şifre güncellendi', 'success');
      document.getElementById('pw-current').value = '';
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-confirm').value = '';
    } else {
      r.json().then(function(d) { showToast('✕ ' + (d.error || 'Hata'), 'danger'); });
    }
  }).catch(function() { showToast('✕ Hata oluştu', 'danger'); });
}

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'alert position-fixed d-flex align-items-center gap-2 alert-' + type;
  el.style.top = '20px';
  el.style.right = '20px';
  el.style.zIndex = 1080;
  el.style.minWidth = '260px';
  setTimeout(() => el.classList.add('d-none'), 2500);
}
</script>
</body>
</html>
