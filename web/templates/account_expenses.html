<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giderler — {{.account.Name}} — Hisar Tour</title>
  <link rel="stylesheet" href="/static/theme/assets/css/main.css">
  <style>
    .clickable-row { cursor: pointer; }
  </style>
</head>
<body>

{{template "topbar_v2" .}}
{{template "sidebar_v2" .}}

<main id="content" class="content py-10">
  <div class="container-fluid">

    <div class="row">
      <div class="col-12">
        <div class="d-flex align-items-center gap-3 mb-4">
          <a href="/accounts/{{.account.ID}}/edit" class="btn btn-icon btn-sm btn-light"><i class="ti ti-arrow-left"></i></a>
          <div>
            <h1 class="fs-3 mb-1">Giderler</h1>
            <p class="mb-0 text-secondary">{{.account.Name}}</p>
          </div>
          <span id="visibleCount" class="badge bg-danger-subtle text-danger-emphasis">{{len .expenses}}</span>
        </div>
      </div>
    </div>

    <!-- Filtreler -->
    <div class="card p-3 mb-3">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <input id="fSearch" type="text" class="form-control" placeholder="Ad ile ara..." oninput="applyFilters()" style="max-width:220px;">
        <select id="fCat" class="form-select" onchange="applyFilters()" style="max-width:200px;">
          <option value="">Tüm kategoriler</option>
          {{range .cats}}
          <option value="{{.Name}}">{{.Name}}</option>
          {{end}}
        </select>
        <input id="fFrom" type="date" class="form-control" onchange="applyFilters()" title="Başlangıç tarihi" style="max-width:160px;">
        <input id="fTo"   type="date" class="form-control" onchange="applyFilters()" title="Bitiş tarihi" style="max-width:160px;">
        <select id="fSort" class="form-select" onchange="applyFilters()" style="max-width:160px;">
          <option value="date-desc">Tarih ↓</option>
          <option value="date-asc">Tarih ↑</option>
          <option value="amount-desc">Tutar ↓</option>
          <option value="amount-asc">Tutar ↑</option>
          <option value="name-asc">Ad A→Z</option>
          <option value="name-desc">Ad Z→A</option>
        </select>
        <button type="button" class="btn btn-outline-secondary" onclick="resetFilters()">Temizle</button>
        <span id="resultInfo" class="small text-secondary ms-auto"></span>
      </div>
    </div>

    <!-- Tablo -->
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div id="tableWrap"></div>
          <div id="pager" class="px-4 py-3 border-top d-none align-items-center gap-2 flex-wrap"></div>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- Detail Modal -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Gider Detayı</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div id="detailBody" class="modal-body"></div>
    </div>
  </div>
</div>

<script src="/static/theme/assets/js/main.js" type="module"></script>
<script>
  const ALL_ROWS = {{json .expenses}};
  const PER_PAGE = 25;
  let filtered = [];
  let currentPage = 1;
  let detailModal;
  document.addEventListener('DOMContentLoaded', () => {
    detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
  });

  function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d)) return s;
    return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
  }

  function isoDate(s) {
    if (!s) return '';
    const d = new Date(s);
    return isNaN(d) ? '' : d.toISOString().slice(0,10);
  }

  function applyFilters() {
    const search = document.getElementById('fSearch').value.trim().toLowerCase();
    const cat    = document.getElementById('fCat').value;
    const from   = document.getElementById('fFrom').value;
    const to     = document.getElementById('fTo').value;
    const sort   = document.getElementById('fSort').value;

    filtered = ALL_ROWS.filter(r => {
      if (search && !r.name.toLowerCase().includes(search)) return false;
      if (cat && r.expense_category_name !== cat) return false;
      const d = isoDate(r.date);
      if (from && d < from) return false;
      if (to   && d > to)   return false;
      return true;
    });

    filtered.sort((a, b) => {
      switch (sort) {
        case 'date-desc':   return new Date(b.date) - new Date(a.date);
        case 'date-asc':    return new Date(a.date) - new Date(b.date);
        case 'amount-desc': return b.amount - a.amount;
        case 'amount-asc':  return a.amount - b.amount;
        case 'name-asc':    return a.name.localeCompare(b.name);
        case 'name-desc':   return b.name.localeCompare(a.name);
      }
    });

    document.getElementById('visibleCount').textContent = filtered.length;
    document.getElementById('resultInfo').textContent =
      filtered.length !== ALL_ROWS.length
        ? `${ALL_ROWS.length} kayıttan ${filtered.length} sonuç`
        : `${ALL_ROWS.length} kayıt`;

    currentPage = 1;
    render();
  }

  function render() {
    const start = (currentPage - 1) * PER_PAGE;
    const slice = filtered.slice(start, start + PER_PAGE);

    if (!filtered.length) {
      document.getElementById('tableWrap').innerHTML =
        '<div class="text-center text-secondary small py-6">Kayıt bulunamadı</div>';
      const pager = document.getElementById('pager');
      pager.classList.add('d-none'); pager.classList.remove('d-flex');
      return;
    }

    let t = `<div class="table-responsive"><table class="table mb-0 table-hover align-middle">
      <thead class="table-light border-light"><tr>
        <th>Ad</th><th>Kategori</th><th class="text-end">Tutar</th><th>Tarih</th>
      </tr></thead><tbody>`;

    slice.forEach(r => {
      t += `<tr class="clickable-row" onclick='openDetail(${JSON.stringify(r)})'>
        <td class="fw-semibold">${escH(r.name)}</td>
        <td><span class="badge bg-danger-subtle text-danger-emphasis">${escH(r.expense_category_name||'')}</span></td>
        <td class="text-end fw-semibold text-danger">−${Number(r.amount).toFixed(2)}</td>
        <td class="text-secondary small">${fmtDate(r.date)}</td>
      </tr>`;
    });
    t += '</tbody></table></div>';
    document.getElementById('tableWrap').innerHTML = t;
    renderPager();
  }

  function renderPager() {
    const total = Math.ceil(filtered.length / PER_PAGE);
    const el = document.getElementById('pager');
    if (total <= 1) { el.classList.add('d-none'); el.classList.remove('d-flex'); return; }

    el.classList.remove('d-none');
    el.classList.add('d-flex');

    let html = `<button type="button" class="btn btn-sm btn-outline-secondary" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    buildRange(currentPage, total).forEach(p => {
      if (p === '…') html += `<span class="text-secondary small px-1">…</span>`;
      else html += `<button type="button" class="btn btn-sm ${p===currentPage?'btn-primary':'btn-outline-secondary'}" onclick="goPage(${p})">${p}</button>`;
    });
    html += `<button type="button" class="btn btn-sm btn-outline-secondary" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
    html += `<span class="small text-secondary ms-auto">${filtered.length} kayıt · ${currentPage}/${total} sayfa</span>`;
    el.innerHTML = html;
  }

  function goPage(p) {
    const total = Math.ceil(filtered.length / PER_PAGE);
    if (p < 1 || p > total) return;
    currentPage = p;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function buildRange(cur, total) {
    if (total <= 7) return Array.from({length:total},(_,i)=>i+1);
    const s = new Set([1,total,cur]);
    for (let i=cur-1;i<=cur+1;i++) if(i>0&&i<=total) s.add(i);
    const sorted=[...s].sort((a,b)=>a-b);
    const r=[];let prev=0;
    for(const p of sorted){if(p-prev>1)r.push('…');r.push(p);prev=p;}
    return r;
  }

  function resetFilters() {
    document.getElementById('fSearch').value = '';
    document.getElementById('fCat').value = '';
    document.getElementById('fFrom').value = '';
    document.getElementById('fTo').value = '';
    document.getElementById('fSort').value = 'date-desc';
    applyFilters();
  }

  function escH(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  applyFilters();

  function openDetail(r) {
    function row(label, value, cls) {
      if (!value && value !== 0) return '';
      return `<div class="d-flex gap-3 py-2 border-bottom">
        <span class="small text-secondary text-uppercase fw-semibold" style="min-width:140px;flex-shrink:0;">${label}</span>
        <span class="small ${cls||''}" style="word-break:break-all;">${escH(String(value))}</span>
      </div>`;
    }
    let html = '';
    html += row('ID', r.id, 'font-monospace text-danger');
    html += row('Ad', r.name);
    html += row('Tutar', '−' + Number(r.amount).toFixed(2) + ' ₺', 'fw-bold text-danger');
    html += row('Tarih', fmtDate(r.date));
    html += row('Kategori', r.expense_category_name);
    html += row('Hesap', r.account_name);
    if (r.tour_code)           html += row('Tur', r.tour_code, 'font-monospace');
    if (r.bank_ref)            html += row('Banka Ref', r.bank_ref, 'font-monospace');
    if (r.counterparty)        html += row('Karşı Taraf', r.counterparty);
    if (r.counterparty_tax_id) html += row('Vergi No', r.counterparty_tax_id, 'font-monospace');
    html += row('Oluşturulma', fmtDate(r.created_at), 'text-secondary');
    html += row('Güncelleme', fmtDate(r.updated_at), 'text-secondary');
    document.getElementById('detailBody').innerHTML = html;
    detailModal.show();
  }
</script>

</body>
</html>
