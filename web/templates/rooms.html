<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odalar — Hisar Tour</title>
  <link rel="stylesheet" href="/static/theme/assets/css/main.css">
</head>
<body>

{{template "topbar_v2" .}}
{{template "sidebar_v2" .}}

<main id="content" class="content py-10">
  <div class="container-fluid">

    <div class="row">
      <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="fs-3 mb-1">Odalar</h1>
            <p class="mb-0 text-secondary">Oda bilgilerini yönetin</p>
          </div>
          <button type="button" class="btn btn-primary" onclick="openCreate()">
            <i class="ti ti-plus"></i> Oda Ekle
          </button>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-lg-3 col-12">
        <div class="card p-4 bg-primary bg-opacity-10 border border-primary border-opacity-25 rounded-2">
          <div class="d-flex gap-3">
            <div class="icon-shape icon-md bg-primary text-white rounded-2">
              <i class="ti ti-bed fs-4"></i>
            </div>
            <div>
              <h2 class="mb-3 fs-6">Toplam Oda</h2>
              <h3 class="fw-bold mb-0">{{len .rooms}}</h3>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12 col-lg-7">
        <div class="card">
          {{if .rooms}}
          <div class="table-responsive">
            <table class="table mb-0 table-hover align-middle">
              <thead class="table-light border-light">
                <tr>
                  <th>#</th>
                  <th>Kod</th>
                  <th class="text-end">Yatak Sayısı</th>
                  <th>Aksiyon</th>
                </tr>
              </thead>
              <tbody>
                {{range .rooms}}
                <tr>
                  <td class="text-secondary">{{.ID}}</td>
                  <td class="fw-semibold">{{.Code}}</td>
                  <td class="text-end fw-semibold">{{.BedsCount}}</td>
                  <td>
                    <div class="d-flex gap-1">
                      <button type="button" class="btn btn-icon btn-sm btn-light" title="Düzenle" onclick='openEdit({{json .}})'>
                        <i class="ti ti-edit"></i>
                      </button>
                      <button type="button" class="btn btn-icon btn-sm btn-light text-danger" title="Sil" onclick="deleteItem({{.ID}})">
                        <i class="ti ti-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>
                {{end}}
              </tbody>
            </table>
          </div>
          {{else}}
          <div class="card-body text-center py-8">
            <i class="ti ti-bed fs-1 text-secondary"></i>
            <p class="fw-semibold mt-3 mb-1">Oda bulunamadı</p>
            <p class="text-secondary mb-4">İlk odayı ekleyin</p>
            <button type="button" class="btn btn-primary" onclick="openCreate()"><i class="ti ti-plus"></i> Oda Ekle</button>
          </div>
          {{end}}
        </div>
      </div>
    </div>

  </div>
</main>

<!-- Oda Modalı -->
<div class="modal fade" id="roomModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Yeni Oda</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <form id="roomForm" onsubmit="saveItem(event)">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Kod</label>
            <input id="fCode" type="text" placeholder="QDR, TRP, DBL..." class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Yatak Sayısı <span class="text-danger">*</span></label>
            <input id="fBeds" type="number" min="1" required placeholder="2" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">İptal</button>
          <button type="submit" class="btn btn-primary">Kaydet</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toast" class="alert position-fixed d-none align-items-center gap-2" style="top:20px; right:20px; z-index:1080; min-width:260px;" role="alert"></div>

<script src="/static/theme/assets/js/main.js" type="module"></script>
<script>
  let editingId = null;
  let roomModal;
  document.addEventListener('DOMContentLoaded', () => {
    roomModal = new bootstrap.Modal(document.getElementById('roomModal'));
  });

  function openCreate() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Yeni Oda';
    document.getElementById('roomForm').reset();
    roomModal.show();
    setTimeout(() => document.getElementById('fCode').focus(), 200);
  }

  function openEdit(room) {
    editingId = room.id;
    document.getElementById('modalTitle').textContent = 'Odayı Düzenle';
    document.getElementById('fCode').value = room.code || '';
    document.getElementById('fBeds').value = room.beds_count;
    roomModal.show();
  }

  async function saveItem(e) {
    e.preventDefault();
    const payload = {
      code:       document.getElementById('fCode').value.trim(),
      beds_count: parseInt(document.getElementById('fBeds').value),
    };
    const url    = editingId ? `/api/rooms/${editingId}` : '/api/rooms';
    const method = editingId ? 'PUT' : 'POST';
    try {
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (res.ok) {
        roomModal.hide();
        showToast('✓ ' + (editingId ? 'Oda güncellendi' : 'Oda eklendi'), 'success');
        setTimeout(() => location.reload(), 700);
      } else {
        const err = await res.json();
        showToast('✕ ' + (err.error || 'Bir hata oluştu'), 'danger');
      }
    } catch { showToast('✕ Sunucu bağlantı hatası', 'danger'); }
  }

  async function deleteItem(id) {
    if (!confirm('Bu odayı silmek istediğinizden emin misiniz?')) return;
    try {
      const res = await fetch(`/api/rooms/${id}`, { method: 'DELETE' });
      if (res.ok) {
        showToast('✓ Oda silindi', 'success');
        setTimeout(() => location.reload(), 700);
      } else { showToast('✕ Silme işlemi başarısız', 'danger'); }
    } catch { showToast('✕ Sunucu bağlantı hatası', 'danger'); }
  }

  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'alert position-fixed d-flex align-items-center gap-2 alert-' + type;
    el.style.top = '20px';
    el.style.right = '20px';
    el.style.zIndex = 1080;
    el.style.minWidth = '260px';
    setTimeout(() => el.classList.add('d-none'), 2800);
  }
</script>
</body>
</html>
