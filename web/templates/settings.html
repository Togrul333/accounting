<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayarlar — Hisar Tour</title>
  <link rel="stylesheet" href="/static/theme/assets/css/main.css">
</head>
<body>

{{template "topbar_v2" .}}
{{template "sidebar_v2" .}}

<main id="content" class="content py-10">
  <div class="container-fluid">

    <div class="row">
      <div class="col-12">
        <div class="mb-4">
          <h1 class="fs-3 mb-1">Ayarlar</h1>
          <p class="mb-0 text-secondary">Döviz kurları</p>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xl-6 col-12">
        <div class="card">
          <div class="card-header bg-transparent px-4 py-3">
            <h3 class="h6 mb-0">Döviz Kurları</h3>
            <p class="small text-secondary mb-0 mt-1">1 birim yabancı para = kaç ₺ (Türk Lirası)</p>
          </div>
          <div class="card-body">

            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="d-flex align-items-center justify-content-center rounded-2 bg-primary bg-opacity-10 text-primary fw-bold" style="width:40px;height:40px;">$</div>
              <div class="flex-grow-1">
                <label class="form-label mb-1">USD → TRY</label>
                <input type="number" step="0.01" min="0" id="rate-usd" class="form-control" placeholder="0.00" value="{{printf "%.4f" .rates.USD}}">
              </div>
            </div>

            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="d-flex align-items-center justify-content-center rounded-2 bg-primary bg-opacity-10 text-primary fw-bold" style="width:40px;height:40px;">€</div>
              <div class="flex-grow-1">
                <label class="form-label mb-1">EUR → TRY</label>
                <input type="number" step="0.01" min="0" id="rate-eur" class="form-control" placeholder="0.00" value="{{printf "%.4f" .rates.EUR}}">
              </div>
            </div>

            <div class="d-flex align-items-center gap-3 mb-4">
              <div class="d-flex align-items-center justify-content-center rounded-2 bg-warning bg-opacity-10 text-warning fw-bold" style="width:40px;height:40px;">£</div>
              <div class="flex-grow-1">
                <label class="form-label mb-1">GBP → TRY</label>
                <input type="number" step="0.01" min="0" id="rate-gbp" class="form-control" placeholder="0.00" value="{{printf "%.4f" .rates.GBP}}">
              </div>
            </div>

            <button type="button" class="btn btn-primary" onclick="saveRates()">
              <i class="ti ti-check"></i> Kaydet
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<div id="toast" class="alert position-fixed d-none align-items-center gap-2" style="top:20px; right:20px; z-index:1080; min-width:260px;" role="alert"></div>

<script src="/static/theme/assets/js/main.js" type="module"></script>
<script>
function saveRates() {
  var usd = parseFloat(document.getElementById('rate-usd').value) || 0;
  var eur = parseFloat(document.getElementById('rate-eur').value) || 0;
  var gbp = parseFloat(document.getElementById('rate-gbp').value) || 0;

  fetch('/api/settings/rates', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({usd: usd, eur: eur, gbp: gbp})
  })
  .then(function(r) {
    if (r.ok) showToast('✓ Kurlar kaydedildi', 'success');
    else showToast('✕ Hata oluştu', 'danger');
  })
  .catch(function() { showToast('✕ Hata oluştu', 'danger'); });
}

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'alert position-fixed d-flex align-items-center gap-2 alert-' + type;
  el.style.top = '20px';
  el.style.right = '20px';
  el.style.zIndex = 1080;
  el.style.minWidth = '260px';
  setTimeout(() => el.classList.add('d-none'), 2500);
}
</script>
</body>
</html>
