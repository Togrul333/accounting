<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hesabı Düzenle — Hisar Tour</title>
  <link rel="stylesheet" href="/static/theme/assets/css/main.css">
</head>
<body>

{{template "topbar_v2" .}}
{{template "sidebar_v2" .}}

<main id="content" class="content py-10">
  <div class="container-fluid">

    <div class="row">
      <div class="col-12">
        <div class="d-flex align-items-center gap-3 mb-4">
          <a href="/accounts" class="btn btn-icon btn-sm btn-light"><i class="ti ti-arrow-left"></i></a>
          <div>
            <h1 class="fs-3 mb-1">Hesabı Düzenle</h1>
            <p class="mb-0 text-secondary">{{.account.Name}}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">

        <!-- Bakiye kartı -->
        <div class="card p-4 mb-3 border-primary border-opacity-25">
          <div class="d-flex align-items-center gap-3">
            <div class="icon-shape icon-md bg-primary bg-opacity-10 text-primary rounded-2">
              <i class="ti ti-coin fs-4"></i>
            </div>
            <div>
              <p class="small text-secondary text-uppercase fw-semibold mb-1">Bakiye</p>
              <p class="fw-bold mb-0 fs-4 {{if lt .account.Balance 0.0}}text-danger{{else}}text-primary{{end}}">
                {{printf "%.2f" .account.Balance}} {{.account.Currency}}
              </p>
              <p class="small text-secondary mb-0">Gelirler − Giderler</p>
            </div>
          </div>
        </div>

        <!-- Form -->
        <div class="card mb-3">
          <div class="card-body">
            <form id="editForm" onsubmit="saveAccount(event)">
              <div class="mb-3">
                <label class="form-label">Ad <span class="text-danger">*</span></label>
                <input id="fName" type="text" required class="form-control" value="{{.account.Name}}">
              </div>
              <div class="mb-3">
                <label class="form-label">Hesap No <span class="text-danger">*</span></label>
                <input id="fAccountNumber" type="text" required class="form-control font-monospace" value="{{.account.AccountNumber}}">
              </div>
              <div class="mb-3">
                <label class="form-label">Para Birimi</label>
                <select id="fCurrency" class="form-select">
                  <option value="AZN" {{if eq .account.Currency "AZN"}}selected{{end}}>AZN — Manat</option>
                  <option value="USD" {{if eq .account.Currency "USD"}}selected{{end}}>USD — Dolar</option>
                  <option value="EUR" {{if eq .account.Currency "EUR"}}selected{{end}}>EUR — Euro</option>
                  <option value="RUB" {{if eq .account.Currency "RUB"}}selected{{end}}>RUB — Ruble</option>
                  <option value="TRY" {{if eq .account.Currency "TRY"}}selected{{end}}>TRY — Lira</option>
                  <option value="GBP" {{if eq .account.Currency "GBP"}}selected{{end}}>GBP — Sterlin</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Açıklama</label>
                <textarea id="fDescription" rows="3" class="form-control" placeholder="İsteğe bağlı not...">{{.account.Description}}</textarea>
              </div>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <button type="submit" class="btn btn-primary"><i class="ti ti-check"></i> Kaydet</button>
                <a href="/accounts" class="btn btn-outline-secondary">İptal</a>
                <button type="button" class="btn btn-success" onclick="document.getElementById('xlsxInput').click()">
                  <i class="ti ti-file-spreadsheet"></i> Excel'den İçe Aktar
                </button>
                <input type="file" id="xlsxInput" accept=".xlsx,.xls" style="display:none" onchange="handleExcelImport(event)">
              </div>
            </form>
          </div>
        </div>

        <!-- Gelirler tablosu -->
        <div class="card mb-3">
          <div class="card-header bg-transparent d-flex align-items-center gap-2 px-4 py-3">
            <span class="badge rounded-pill bg-primary">&nbsp;</span>
            <h3 class="h6 mb-0">Gelirler</h3>
            <span id="incomeCount" class="badge bg-primary-subtle text-primary-emphasis">{{len .incomes}}</span>
            <a href="/accounts/{{.account.ID}}/incomes" class="small text-primary text-decoration-underline ms-auto">Tümünü Gör</a>
          </div>
          <div id="incomeTableWrap"></div>
          <div id="incomePager" class="px-4 py-3 border-top d-none align-items-center gap-2 flex-wrap"></div>
        </div>

        <!-- Giderler tablosu -->
        <div class="card mb-3">
          <div class="card-header bg-transparent d-flex align-items-center gap-2 px-4 py-3">
            <span class="badge rounded-pill bg-danger">&nbsp;</span>
            <h3 class="h6 mb-0">Giderler</h3>
            <span id="expenseCount" class="badge bg-danger-subtle text-danger-emphasis">{{len .expenses}}</span>
            <a href="/accounts/{{.account.ID}}/expenses" class="small text-danger text-decoration-underline ms-auto">Tümünü Gör</a>
          </div>
          <div id="expenseTableWrap"></div>
          <div id="expensePager" class="px-4 py-3 border-top d-none align-items-center gap-2 flex-wrap"></div>
        </div>

      </div>
    </div>

  </div>
</main>

<div id="toast" class="alert position-fixed d-none align-items-center gap-2" style="top:20px; right:20px; z-index:1080; min-width:260px;" role="alert"></div>

<!-- Excel Import Preview Modal -->
<div class="modal fade" id="importModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-0">Banka Ekstresi — Önizleme</h5>
          <p id="importMeta" class="small text-secondary mb-0 mt-1"></p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="px-4 py-3 border-bottom d-flex align-items-end gap-3 flex-wrap">
        <div style="min-width:200px;">
          <label class="form-label small text-secondary text-uppercase fw-semibold">Gelir Kategorisi</label>
          <select id="importIncomeCat" class="form-select">
            <option value="">— seçin —</option>
            {{range .incomeCats}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
          </select>
        </div>
        <div style="min-width:200px;">
          <label class="form-label small text-secondary text-uppercase fw-semibold">Gider Kategorisi</label>
          <select id="importExpenseCat" class="form-select">
            <option value="">— seçin —</option>
            {{range .expenseCats}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
          </select>
        </div>
        <div class="d-flex flex-column gap-1">
          <div id="importError" class="small text-danger d-none"></div>
          <button id="importBtn" type="button" class="btn btn-success" onclick="doImport()">
            <i class="ti ti-download"></i> İmport Et
          </button>
        </div>
      </div>
      <div class="modal-body">
        <div id="importTableWrapper"></div>
      </div>
    </div>
  </div>
</div>

<script src="/static/theme/assets/js/main.js" type="module"></script>
<script>
  const accountId = {{.account.ID}};
  const INCOMES  = {{json .incomes}};
  const EXPENSES = {{json .expenses}};
  const PER_PAGE = 10;
  let importModal;
  document.addEventListener('DOMContentLoaded', () => {
    importModal = new bootstrap.Modal(document.getElementById('importModal'));
  });

  async function saveAccount(e) {
    e.preventDefault();
    const payload = {
      name:           document.getElementById('fName').value.trim(),
      account_number: document.getElementById('fAccountNumber').value.trim(),
      currency:       document.getElementById('fCurrency').value,
      description:    document.getElementById('fDescription').value.trim(),
    };
    try {
      const res = await fetch(`/api/accounts/${accountId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (res.ok) {
        showToast('✓ Hesap güncellendi', 'success');
        setTimeout(() => window.location.href = '/accounts', 700);
      } else {
        const err = await res.json();
        showToast('✕ ' + (err.error || 'Bir hata oluştu'), 'danger');
      }
    } catch { showToast('✕ Sunucu bağlantı hatası', 'danger'); }
  }

  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'alert position-fixed d-flex align-items-center gap-2 alert-' + type;
    el.style.top = '20px';
    el.style.right = '20px';
    el.style.zIndex = 1080;
    el.style.minWidth = '260px';
    setTimeout(() => el.classList.add('d-none'), 2800);
  }

  function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s);
    return isNaN(d) ? s : `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
  }

  function renderTable(data, page, type) {
    if (!data || !data.length) {
      return `<div class="text-center text-secondary small py-4">Bu hesaba ait ${type==='income'?'gelir':'gider'} yok</div>`;
    }
    const start = (page - 1) * PER_PAGE;
    const slice = data.slice(start, start + PER_PAGE);
    const badgeClass = type === 'income' ? 'bg-primary-subtle text-primary-emphasis' : 'bg-danger-subtle text-danger-emphasis';
    const amtClass   = type === 'income' ? 'text-primary' : 'text-danger';
    const sign       = type === 'income' ? '+' : '−';
    const catField   = type === 'income' ? 'income_category_name' : 'expense_category_name';

    let t = `<div class="table-responsive"><table class="table mb-0 align-middle"><thead class="table-light border-light"><tr>
      <th>Ad</th><th>Kategori</th><th class="text-end">Tutar</th><th>Tarih</th>
    </tr></thead><tbody>`;

    slice.forEach(row => {
      t += `<tr>
        <td class="fw-semibold">${escH(row.name)}</td>
        <td><span class="badge ${badgeClass}">${escH(row[catField]||'')}</span></td>
        <td class="text-end fw-semibold ${amtClass}">${sign}${Number(row.amount).toFixed(2)}</td>
        <td class="text-secondary small">${fmtDate(row.date)}</td>
      </tr>`;
    });
    t += '</tbody></table></div>';
    return t;
  }

  function renderPager(data, page, setPage, pagerId) {
    const total = Math.ceil(data.length / PER_PAGE);
    const el = document.getElementById(pagerId);
    if (total <= 1) { el.classList.add('d-none'); el.classList.remove('d-flex'); return; }

    el.classList.remove('d-none');
    el.classList.add('d-flex');

    let html = `<button type="button" class="btn btn-sm btn-outline-secondary" onclick="${setPage}(${page-1})" ${page===1?'disabled':''}>‹</button>`;
    buildPageRange(page, total).forEach(p => {
      if (p === '…') html += `<span class="text-secondary small px-1">…</span>`;
      else html += `<button type="button" class="btn btn-sm ${p===page?'btn-primary':'btn-outline-secondary'}" onclick="${setPage}(${p})">${p}</button>`;
    });
    html += `<button type="button" class="btn btn-sm btn-outline-secondary" onclick="${setPage}(${page+1})" ${page===total?'disabled':''}>›</button>`;
    html += `<span class="small text-secondary ms-auto">${data.length} kayıt · ${page}/${total}</span>`;
    el.innerHTML = html;
  }

  function buildPageRange(cur, total) {
    if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
    const pages = new Set([1, total, cur]);
    for (let i = cur-1; i <= cur+1; i++) if (i > 0 && i <= total) pages.add(i);
    const sorted = [...pages].sort((a,b) => a-b);
    const result = [];
    let prev = 0;
    for (const p of sorted) {
      if (p - prev > 1) result.push('…');
      result.push(p);
      prev = p;
    }
    return result;
  }

  function escH(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let incomePage = 1, expensePage = 1;

  function setIncomePage(p) {
    const total = Math.ceil((INCOMES||[]).length / PER_PAGE);
    if (p < 1 || p > total) return;
    incomePage = p;
    document.getElementById('incomeTableWrap').innerHTML = renderTable(INCOMES, incomePage, 'income');
    renderPager(INCOMES, incomePage, 'setIncomePage', 'incomePager');
  }

  function setExpensePage(p) {
    const total = Math.ceil((EXPENSES||[]).length / PER_PAGE);
    if (p < 1 || p > total) return;
    expensePage = p;
    document.getElementById('expenseTableWrap').innerHTML = renderTable(EXPENSES, expensePage, 'expense');
    renderPager(EXPENSES, expensePage, 'setExpensePage', 'expensePager');
  }

  setIncomePage(1);
  setExpensePage(1);

  // ── Excel içe aktarma ──
  let _lastFile = null;

  const COL_DEFS = [
    { key: 'date',   az: 'Əməliyyatın tarixi',        tr: 'Tarih' },
    { key: 'ref',    az: 'Əməliyyatın referensi',     tr: 'Referans' },
    { key: 'cp',     az: 'Əks hesab üzrə məlumatlar', tr: 'Karşı Taraf' },
    { key: 'debit',  az: 'Debit məbləğ',              tr: 'Gider Tutarı' },
    { key: 'credit', az: 'Kredit məbləğ',             tr: 'Gelir Tutarı' },
    { key: 'desc',   az: 'Ödənişin təyinatı',         tr: 'Açıklama' },
    { key: 'tax',    az: 'Qarşı tərəfin VÖEN-i',      tr: 'Vergi No' },
  ];

  async function handleExcelImport(event) {
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    _lastFile = file;

    const form = new FormData();
    form.append('file', file);

    let data;
    try {
      const res = await fetch(`/api/accounts/${accountId}/statement-preview`, { method: 'POST', body: form });
      data = await res.json();
      if (!res.ok) { showToast('✕ ' + (data.error || 'Xəta baş verdi'), 'danger'); return; }
    } catch {
      showToast('✕ Sunucu bağlantı hatası', 'danger');
      return;
    }

    document.getElementById('importMeta').textContent =
      `IBAN: ${data.iban} · ${data.gelirler.length} gelir · ${data.giderler.length} gider`;

    function buildTable(rows) {
      if (!rows.length) return '<p class="text-secondary small py-3">Məlumat yoxdur</p>';
      let t = '<div class="table-responsive"><table class="table table-sm mb-0"><thead class="table-light"><tr><th>#</th>';
      COL_DEFS.forEach(c => {
        t += `<th><span class="d-block">${c.az}</span><span class="small text-secondary fw-normal">(${c.tr})</span></th>`;
      });
      t += '</tr></thead><tbody>';
      rows.forEach((row, i) => {
        t += `<tr><td class="text-secondary small">${i + 1}</td>`;
        COL_DEFS.forEach(c => {
          let cell = '';
          if      (c.key === 'date')   cell = `<span class="text-nowrap">${escHtml(row.date)}</span>`;
          else if (c.key === 'ref')    cell = `<span class="font-monospace small text-secondary">${escHtml(row.ref)}</span>`;
          else if (c.key === 'cp')     cell = escHtml(row.cp);
          else if (c.key === 'debit')  cell = row.debit  > 0 ? `<span class="text-danger fw-semibold">−${row.debit.toFixed(2)}</span>`  : `<span class="text-secondary">—</span>`;
          else if (c.key === 'credit') cell = row.credit > 0 ? `<span class="text-primary fw-semibold">+${row.credit.toFixed(2)}</span>` : `<span class="text-secondary">—</span>`;
          else if (c.key === 'desc')   cell = `<span class="text-secondary" style="white-space:pre-line;">${escHtml(row.desc)}</span>`;
          else if (c.key === 'tax')    cell = `<span class="font-monospace small text-secondary">${escHtml(row.tax)}</span>`;
          t += `<td style="max-width:260px;word-break:break-word;">${cell}</td>`;
        });
        t += '</tr>';
      });
      t += '</tbody></table></div>';
      return t;
    }

    function sectionHeader(label, count, total, badgeClass, amountClass) {
      return `<div class="d-flex align-items-center gap-2 mb-3">
        <span class="badge rounded-pill ${badgeClass}">&nbsp;</span>
        <span class="small text-uppercase fw-semibold">${label}</span>
        <span class="badge ${badgeClass.replace('bg-','bg-').includes('primary') ? 'bg-primary-subtle text-primary-emphasis' : 'bg-danger-subtle text-danger-emphasis'}">${count}</span>
        <span class="ms-auto fw-bold ${amountClass}">${total.toFixed(2)} ₼</span>
      </div>`;
    }

    let html = '<div class="mb-4">';
    html += sectionHeader('Gelirler (Kredit)', data.gelirler.length, data.total_credit, 'bg-primary', 'text-primary');
    html += buildTable(data.gelirler);
    html += '</div>';
    html += '<div class="border-top pt-4">';
    html += sectionHeader('Giderler (Debit)', data.giderler.length, data.total_debit, 'bg-danger', 'text-danger');
    html += buildTable(data.giderler);
    html += '</div>';

    document.getElementById('importTableWrapper').innerHTML = html;
    importModal.show();
  }

  function setImportError(msg) {
    const el = document.getElementById('importError');
    if (msg) { el.textContent = '✕ ' + msg; el.classList.remove('d-none'); }
    else      { el.classList.add('d-none'); }
  }

  async function doImport() {
    setImportError('');
    const incomeCatId  = document.getElementById('importIncomeCat').value;
    const expenseCatId = document.getElementById('importExpenseCat').value;
    if (!incomeCatId)  { setImportError('Gelir kategorisini seçin'); return; }
    if (!expenseCatId) { setImportError('Gider kategorisini seçin'); return; }
    if (!_lastFile)    { setImportError('Fayl tapılmadı, yenidən seçin'); return; }

    const btn = document.getElementById('importBtn');
    btn.disabled = true;
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Gözləyin...';

    const form = new FormData();
    form.append('file', _lastFile);
    form.append('income_category_id',  incomeCatId);
    form.append('expense_category_id', expenseCatId);

    try {
      const res  = await fetch(`/api/accounts/${accountId}/statement-import`, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) { setImportError(data.error || 'Xəta baş verdi'); return; }
      importModal.hide();
      let msg = `✓ ${data.imported_incomes} gelir, ${data.imported_expenses} gider əlavə edildi`;
      if (data.skipped_duplicates > 0) msg += ` (${data.skipped_duplicates} təkrar işlem keçildi)`;
      showToast(msg, 'success');
      setTimeout(() => location.reload(), 1200);
    } catch (err) {
      setImportError('Sunucu bağlantı hatası');
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
