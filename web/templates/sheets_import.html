<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets — Hisar Tour</title>
  <link rel="stylesheet" href="/static/theme/assets/css/main.css">
  <style>
    .spinner-sm { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; display:inline-block; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .list-item-btn { cursor: pointer; transition: all .15s; }
    .list-item-btn.active { background: var(--bs-primary-bg-subtle) !important; border-color: var(--bs-primary) !important; color: var(--bs-primary) !important; }
  </style>
</head>
<body>

{{template "topbar_v2" .}}
{{template "sidebar_v2" .}}

<main id="content" class="content py-10">
  <div class="container-fluid">

    <div class="row">
      <div class="col-12">
        <div class="mb-4">
          <h1 class="fs-3 mb-1">Google Sheets</h1>
          <p class="mb-0 text-secondary">Google Sheets üzerinden veri çekin</p>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12 col-xl-8">
        <div class="card mb-3">
          <div class="card-body">
            <label class="form-label">Google Sheets bağlantısı</label>
            <div class="d-flex gap-2 flex-wrap">
              <input id="sheetUrl" type="text" placeholder="https://docs.google.com/spreadsheets/d/..." class="form-control" style="max-width:480px;">
              <button id="tabsBtn" onclick="fetchTabs()" class="btn btn-primary text-nowrap">
                <span id="tabsBtnLabel">Sekmeleri Getir</span>
              </button>
            </div>

            <div id="tabsList" class="d-flex flex-column gap-1 mt-3" style="display:none;"></div>

            <p id="sheetMeta" class="small text-secondary mb-0 mt-2"></p>
          </div>
        </div>

        <div id="savedLinksWrap" class="card mb-3" style="display:none;">
          <div class="card-body">
            <p class="small text-secondary text-uppercase fw-semibold mb-2">Kayıtlı bağlantılar</p>
            <div id="savedLinksList" class="d-flex flex-column gap-1"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="resultSection" style="display:none;">
      <div class="d-flex align-items-center gap-3 mb-3">
        <div class="icon-shape icon-md bg-primary bg-opacity-10 text-primary rounded-2">
          <i class="ti ti-table fs-4"></i>
        </div>
        <div>
          <p id="resultTitle" class="fw-bold mb-0 fs-5"></p>
          <p id="resultSubtitle" class="small text-secondary mb-0 mt-1"></p>
        </div>
      </div>
      <div class="card">
        <div class="table-responsive">
          <table class="table mb-0 table-sm">
            <thead class="table-light border-light">
              <tr id="tableHead"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="turlarSection" style="display:none;">
      <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-shape icon-md bg-primary bg-opacity-10 text-primary rounded-2">
            <i class="ti ti-map-2 fs-4"></i>
          </div>
          <div>
            <p class="fw-bold mb-0 fs-5">Turlar</p>
            <p id="turlarSubtitle" class="small text-secondary mb-0 mt-1"></p>
          </div>
        </div>
        <button id="importAllBtn" onclick="importAllTours()" class="btn btn-primary">
          <span id="importAllBtnLabel">Tümünü İçe Aktar</span>
        </button>
      </div>
      <div id="turlarList" class="d-flex flex-column gap-2"></div>
    </div>

    <div id="passengerSection" style="display:none;">
      <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <div class="d-flex align-items-center gap-3">
          <div class="icon-shape icon-md bg-primary bg-opacity-10 text-primary rounded-2">
            <i class="ti ti-users fs-4"></i>
          </div>
          <div>
            <p class="fw-bold mb-0 fs-5">Sərnişinlər — <span id="passengerTourCode"></span></p>
            <p id="passengerSubtitle" class="small text-secondary mb-0 mt-1"></p>
          </div>
        </div>
        <button id="passengerAllBtn" onclick="createAllPassengers()" class="btn btn-primary">
          <span id="passengerAllBtnLabel">Hamısını Yarat</span>
        </button>
      </div>
      <div id="passengerProgressLog" class="card mb-3 p-3" style="display:none; max-height:220px; overflow-y:auto; font-size:12px; font-family:monospace;"></div>
      <div id="passengerList" class="d-flex flex-column gap-2"></div>
    </div>

    <div id="emptyState" class="card">
      <div class="card-body text-center py-8">
        <i class="ti ti-table fs-1 text-secondary"></i>
        <p class="fw-semibold mt-3 mb-1">Henüz veri çekilmedi</p>
        <p class="text-secondary mb-0">Yukarıya Google Sheets bağlantısını yapıştırıp "Sekmeleri Getir" butonuna basın, sonra bir sekme seçin</p>
      </div>
    </div>

  </div>
</main>

<div id="toast" class="alert position-fixed d-none align-items-center gap-2" style="top:20px; right:20px; z-index:1080; min-width:260px;" role="alert"></div>

<!-- Dinamik Onay Modalı -->
<div class="modal fade" id="dynamicModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-0" id="modalTitle"></h5>
          <p id="modalSubtitle" class="small text-secondary mb-0 mt-1"></p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat" id="modalXBtn"></button>
      </div>
      <div id="modalBody" class="modal-body d-flex flex-column gap-3"></div>
      <div class="modal-footer">
        <button id="modalCancelBtn" type="button" class="btn btn-outline-secondary">İptal</button>
        <button id="modalConfirmBtn" type="button" class="btn btn-primary">Təsdiqlə</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/theme/assets/js/main.js" type="module"></script>
<script>
  let currentSpreadsheetId = null;
  let activeTabGID = null;
  let tourCodes = new Set();
  const IMPORT_DISCOUNT_CATEGORY_NAME = 'Sheets İmport';
  let importDiscountCategoryId = null;

  async function getImportDiscountCategoryId() {
    if (importDiscountCategoryId !== null) return importDiscountCategoryId;
    const res = await fetch('/api/discount-categories');
    const categories = res.ok ? await res.json() : [];
    const existing = categories.find(c => c.name === IMPORT_DISCOUNT_CATEGORY_NAME);
    if (existing) {
      importDiscountCategoryId = existing.id;
      return importDiscountCategoryId;
    }
    const createRes = await fetch('/api/discount-categories', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: IMPORT_DISCOUNT_CATEGORY_NAME }),
    });
    const created = createRes.ok ? await createRes.json() : null;
    importDiscountCategoryId = created ? created.id : 0;
    return importDiscountCategoryId;
  }

  let accountsList = null;
  let incomeCategoriesList = null;
  let lastIncomeAccountId = null;
  let lastIncomeCategoryId = null;

  async function getAccountsList() {
    if (accountsList !== null) return accountsList;
    const res = await fetch('/api/accounts');
    accountsList = res.ok ? await res.json() : [];
    return accountsList;
  }

  async function getIncomeCategoriesList() {
    if (incomeCategoriesList !== null) return incomeCategoriesList;
    const res = await fetch('/api/income-categories');
    incomeCategoriesList = res.ok ? await res.json() : [];
    return incomeCategoriesList;
  }

  let dynamicModal;
  document.addEventListener('DOMContentLoaded', () => {
    dynamicModal = new bootstrap.Modal(document.getElementById('dynamicModal'));
  });

  function ddmmyyyyToIso(s) {
    const m = (s || '').trim().match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
    if (!m) return '';
    const [, d, mo, y] = m;
    return `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }
  function isoToDdmmyyyy(s) {
    const m = (s || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return '';
    const [, y, mo, d] = m;
    return `${d}.${mo}.${y}`;
  }

  function openModal({ title, subtitle, fields }) {
    return new Promise(resolve => {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalSubtitle').textContent = subtitle || '';
      const body = document.getElementById('modalBody');
      body.innerHTML = '';

      (fields || []).forEach(f => {
        const wrap = document.createElement('div');
        if (f.type === 'info') {
          wrap.innerHTML = `<p class="small text-secondary mb-0">${f.label}: <span class="text-body">${f.value ?? '—'}</span></p>`;
        } else if (f.type === 'select') {
          const opts = (f.options || []).map(o => `<option value="${o.value}" ${String(o.value) === String(f.value) ? 'selected' : ''}>${o.label}</option>`).join('');
          wrap.innerHTML = `<div>
            <label class="form-label small">${f.label}</label>
            <select id="modalField_${f.key}" class="form-select">${opts}</select>
          </div>`;
        } else {
          wrap.innerHTML = `<div>
            <label class="form-label small">${f.label}</label>
            <input id="modalField_${f.key}" class="form-control" type="${f.type || 'text'}" value="${f.value ?? ''}">
          </div>`;
        }
        body.appendChild(wrap);
      });

      const confirmBtn = document.getElementById('modalConfirmBtn');
      const cancelBtn = document.getElementById('modalCancelBtn');
      const xBtn = document.getElementById('modalXBtn');
      dynamicModal.show();

      let resolved = false;
      function cleanup(result) {
        if (resolved) return;
        resolved = true;
        confirmBtn.onclick = null;
        cancelBtn.onclick = null;
        // Bootstrap's hide() animates out; resolving before it finishes lets a
        // chained openModal() call show() while the previous one is still
        // transitioning, which leaves the new modal stuck at display:none.
        document.getElementById('dynamicModal').addEventListener('hidden.bs.modal', () => resolve(result), { once: true });
        dynamicModal.hide();
      }

      confirmBtn.onclick = () => {
        const result = {};
        (fields || []).forEach(f => {
          if (f.type === 'info') return;
          const el = document.getElementById(`modalField_${f.key}`);
          result[f.key] = f.type === 'number' || f.type === 'select' ? parseFloat(el.value) || el.value : el.value;
        });
        cleanup(result);
      };
      cancelBtn.onclick = () => cleanup(null);
      xBtn.onclick = () => cleanup(null);
    });
  }

  async function loadSavedLinks() {
    try {
      const res = await fetch('/api/sheets-import/links');
      const data = await res.json();
      const links = data.links || [];
      const wrap = document.getElementById('savedLinksWrap');
      const list = document.getElementById('savedLinksList');
      list.innerHTML = '';
      if (!links.length) { wrap.style.display = 'none'; return; }

      links.forEach(link => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'btn btn-outline-secondary text-start list-item-btn';
        item.innerHTML = `<span class="text-truncate d-block">${link.url}</span>`;
        item.onclick = () => {
          document.getElementById('sheetUrl').value = link.url;
          fetchTabs();
        };
        list.appendChild(item);
      });
      wrap.style.display = 'block';
    } catch {}
  }

  async function fetchTabs() {
    const url = document.getElementById('sheetUrl').value.trim();
    if (!url) { showToast('✕ Link daxil edin', 'danger'); return; }

    const btn = document.getElementById('tabsBtn');
    const label = document.getElementById('tabsBtnLabel');
    btn.disabled = true;
    label.innerHTML = '<span class="spinner-sm"></span>';

    try {
      const res = await fetch('/api/sheets-import/tabs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();
      if (!res.ok) { showToast('✕ ' + (data.error || 'Xəta baş verdi'), 'danger'); return; }

      currentSpreadsheetId = data.spreadsheet_id;
      activeTabGID = null;
      renderTabsList(data.tabs || []);
      document.getElementById('tabsList').style.display = 'block';
      showToast(`✓ ${(data.tabs || []).length} sekme bulundu`, 'success');
      loadSavedLinks();
    } catch {
      showToast('✕ Sunucu bağlantı hatası', 'danger');
    } finally {
      btn.disabled = false;
      label.textContent = 'Sekmeleri Getir';
    }
  }

  loadSavedLinks();

  function renderTabsList(tabs) {
    const list = document.getElementById('tabsList');
    list.innerHTML = '';
    tabs.forEach(tab => {
      const item = document.createElement('button');
      item.type = 'button';
      item.dataset.gid = tab.gid;
      item.className = 'btn btn-outline-secondary d-flex align-items-center justify-content-between list-item-btn';
      item.innerHTML = `<span>${tab.title}</span><span class="small text-secondary">gid=${tab.gid}</span>`;
      item.onclick = () => selectTab(tab.gid, tab.title, item);
      list.appendChild(item);
    });
  }

  function markActiveTab(el) {
    document.querySelectorAll('#tabsList button').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }

  async function selectTab(gid, title, el) {
    if (!currentSpreadsheetId) return;
    activeTabGID = gid;
    markActiveTab(el);
    document.getElementById('sheetMeta').innerHTML = '<span class="spinner-sm" style="border-color:rgba(0,0,0,0.2); border-top-color:var(--bs-primary);"></span> Yükleniyor...';
    document.getElementById('resultSection').style.display = 'none';
    document.getElementById('turlarSection').style.display = 'none';
    document.getElementById('passengerSection').style.display = 'none';

    const trimmedTitle = title.trim();

    if (trimmedTitle.toLowerCase() === 'turlar') {
      await loadTurlarView(gid);
      document.getElementById('sheetMeta').textContent = '';
      return;
    }

    await loadLookups();
    if (tourCodes.has(normKey(trimmedTitle)) || trimmedTitle.toLowerCase() === 'genel liste') {
      await loadPassengerView(gid, trimmedTitle);
      document.getElementById('sheetMeta').textContent = '';
      return;
    }

    try {
      const res = await fetch('/api/sheets-import/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ spreadsheet_id: currentSpreadsheetId, gid }),
      });
      const data = await res.json();
      if (!res.ok) { showToast('✕ ' + (data.error || 'Xəta baş verdi'), 'danger'); document.getElementById('sheetMeta').textContent = ''; return; }

      document.getElementById('sheetMeta').textContent = '';
      openSheet(data.sheet_title, data.headers || [], data.rows || []);
    } catch {
      showToast('✕ Sunucu bağlantı hatası', 'danger');
      document.getElementById('sheetMeta').textContent = '';
    }
  }

  let turlarTours = [];
  let roomsByCode = {};
  let categoriesByName = {};
  let flightsList = [];
  let lastFlightId = null;
  const NEW_FLIGHT_VALUE = '__new__';

  function normKey(s) { return (s || '').trim().toLowerCase(); }

  function guessBedsCount(code) {
    const c = (code || '').toUpperCase();
    if (c.includes('QDR')) return 4;
    if (c.includes('TRP')) return 3;
    if (c.includes('SNG')) return 1;
    return 2;
  }

  async function loadLookups() {
    try {
      const [roomsRes, catsRes, toursRes, flightsRes] = await Promise.all([
        fetch('/api/rooms'),
        fetch('/api/tour-categories'),
        fetch('/api/tours'),
        fetch('/api/flights'),
      ]);
      const rooms = await roomsRes.json();
      const cats = await catsRes.json();
      const tours = await toursRes.json();
      const flights = await flightsRes.json();
      roomsByCode = {};
      (rooms || []).forEach(r => { if (r.code) roomsByCode[normKey(r.code)] = r; });
      categoriesByName = {};
      (cats || []).forEach(c => { categoriesByName[normKey(c.name)] = c; });
      tourCodes = new Set((tours || []).map(t => normKey(t.code)));
      flightsList = flights || [];
    } catch {}
  }

  function flightLabel(f) {
    const dep = (f.departure_time || '').replace('T', ' ').slice(0, 16);
    return `${f.pnr || '—'} · ${dep}`;
  }

  async function createFlightViaModal() {
    const result = await openModal({
      title: 'Yeni uçuş yaradılsın?',
      subtitle: 'Uçuş məlumatlarını daxil edin',
      fields: [
        { key: 'pnr', label: 'PNR', type: 'text', value: '' },
        { key: 'departure_time', label: 'Uçuş Zamanı', type: 'datetime-local', value: '' },
        { key: 'price', label: 'Fiyat (₺)', type: 'number', value: 0 },
        { key: 'deposit', label: 'Depozit (₺)', type: 'number', value: 0 },
        { key: 'pax_count', label: 'Pax Sayısı', type: 'number', value: 0 },
      ],
    });
    if (!result || !result.pnr || !result.departure_time) return null;

    const res = await fetch('/api/flights', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pnr: result.pnr,
        departure_time: result.departure_time,
        price: parseFloat(result.price) || 0,
        deposit: parseFloat(result.deposit) || 0,
        pax_count: parseInt(result.pax_count) || 0,
      }),
    });
    if (!res.ok) { showToast('✕ Uçuş yaradıla bilmədi', 'danger'); return null; }
    const flight = await res.json();
    flightsList.push(flight);
    return flight;
  }

  async function resolveFlightIds(tour) {
    if (!flightsList.length) {
      const flight = await createFlightViaModal();
      if (!flight) return null;
      lastFlightId = flight.id;
      return [flight.id];
    }

    const options = flightsList.map(f => ({ value: f.id, label: flightLabel(f) }));
    options.push({ value: NEW_FLIGHT_VALUE, label: '+ Yeni uçuş yarat' });

    const result = await openModal({
      title: 'Uçuş seçimi',
      subtitle: `"${tour.code}" üçün uçuş seçin`,
      fields: [
        { key: 'flight_id', label: 'Uçuş', type: 'select', options, value: lastFlightId ?? options[0]?.value },
      ],
    });
    if (!result) return null;

    if (String(result.flight_id) === NEW_FLIGHT_VALUE) {
      const flight = await createFlightViaModal();
      if (!flight) return null;
      lastFlightId = flight.id;
      return [flight.id];
    }

    const flightId = parseInt(result.flight_id);
    lastFlightId = flightId;
    return [flightId];
  }

  async function loadTurlarView(gid) {
    await loadLookups();
    try {
      const res = await fetch('/api/sheets-import/turlar-candidates', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ spreadsheet_id: currentSpreadsheetId, gid }),
      });
      const data = await res.json();
      if (!res.ok) { showToast('✕ ' + (data.error || 'Xəta baş verdi'), 'danger'); return; }

      turlarTours = data.tours || [];
      renderTurlarList();
      document.getElementById('turlarSubtitle').textContent = `${turlarTours.length} tur tapıldı`;
      document.getElementById('turlarSection').style.display = 'block';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('turlarSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch {
      showToast('✕ Sunucu bağlantı hatası', 'danger');
    }
  }

  function renderTurlarList() {
    const list = document.getElementById('turlarList');
    list.innerHTML = '';
    turlarTours.forEach((tour, idx) => {
      const row = document.createElement('div');
      row.className = 'card p-3 d-flex flex-row align-items-center justify-content-between';
      const badge = tour.exists
        ? `<span class="badge bg-primary-subtle text-primary-emphasis">Mövcuddur</span>`
        : `<span class="badge bg-warning-subtle text-warning-emphasis">Yeni</span>`;
      row.innerHTML = `
        <div>
          <p class="fw-semibold mb-0">${tour.code}</p>
          <p class="small text-secondary mb-0 mt-1">${tour.start_date} — ${tour.end_date} · ${tour.items.length} qeyd</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          ${badge}
          <button data-idx="${idx}" class="tour-import-btn btn btn-primary btn-sm" ${tour.exists ? 'disabled' : ''}>
            İçe Aktar
          </button>
        </div>`;
      row.querySelector('.tour-import-btn').onclick = (e) => importTour(idx, e.currentTarget);
      list.appendChild(row);
    });
  }

  async function resolveRoomId(item) {
    const key = normKey(item.room_code);
    if (roomsByCode[key]) return roomsByCode[key].id;
    const result = await openModal({
      title: 'Yeni otaq yaradılsın?',
      subtitle: `Otaq tipi "${item.room_code}" bazada tapılmadı`,
      fields: [
        { key: 'code', label: 'Kod', type: 'text', value: item.room_code },
        { key: 'price', label: 'Qiymət', type: 'number', value: item.price },
        { key: 'beds_count', label: 'Yataq sayı', type: 'number', value: guessBedsCount(item.room_code) },
      ],
    });
    if (!result) return null;
    const res = await fetch('/api/rooms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(result),
    });
    if (!res.ok) return null;
    const room = await res.json();
    roomsByCode[key] = room;
    return room.id;
  }

  async function resolveCategoryId(item) {
    const key = normKey(item.category_name);
    if (categoriesByName[key]) return categoriesByName[key].id;
    const result = await openModal({
      title: 'Yeni kateqoriya yaradılsın?',
      subtitle: `Kateqoriya "${item.category_name}" bazada tapılmadı`,
      fields: [
        { key: 'name', label: 'Ad', type: 'text', value: item.category_name },
        { key: 'price', label: 'Qiymət', type: 'number', value: item.price },
      ],
    });
    if (!result) return null;
    const res = await fetch('/api/tour-categories', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(result),
    });
    if (!res.ok) return null;
    const cat = await res.json();
    categoriesByName[key] = cat;
    return cat.id;
  }

  async function importTour(idx, btn) {
    const tour = turlarTours[idx];
    if (btn) { btn.disabled = true; btn.textContent = 'Yüklənir...'; }

    const flightIds = await resolveFlightIds(tour);
    if (!flightIds || !flightIds.length) {
      if (btn) { btn.disabled = false; btn.textContent = 'İçe Aktar'; }
      showToast(`✕ ${tour.code} — uçuş seçilmədi, idxal edilmədi`, 'danger');
      return;
    }

    let created = 0;
    for (const item of tour.items) {
      const roomId = await resolveRoomId(item);
      const categoryId = await resolveCategoryId(item);
      if (!roomId || !categoryId) continue;

      const res = await fetch('/api/tours', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: tour.code,
          start_date: tour.start_date,
          end_date: tour.end_date,
          tour_category_id: categoryId,
          room_id: roomId,
          flight_ids: flightIds,
        }),
      });
      if (res.ok) created++;
    }

    tour.exists = true;
    renderTurlarList();
    showToast(created > 0 ? `✓ ${tour.code} — ${created} qeyd əlavə edildi` : `✕ ${tour.code} üçün heç nə əlavə edilmədi`, created > 0 ? 'success' : 'danger');
  }

  async function importAllTours() {
    const btn = document.getElementById('importAllBtn');
    const label = document.getElementById('importAllBtnLabel');
    btn.disabled = true;
    label.textContent = 'İçe aktarılır...';

    for (let i = 0; i < turlarTours.length; i++) {
      if (turlarTours[i].exists) continue;
      await importTour(i, null);
    }

    btn.disabled = false;
    label.textContent = 'Tümünü İçe Aktar';
  }

  let passengerCandidates = [];

  async function loadPassengerView(gid, tourCode) {
    try {
      const res = await fetch('/api/sheets-import/passenger-candidates', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ spreadsheet_id: currentSpreadsheetId, gid }),
      });
      const data = await res.json();
      if (!res.ok) { showToast('✕ ' + (data.error || 'Xəta baş verdi'), 'danger'); return; }

      passengerCandidates = data.passengers || [];
      document.getElementById('passengerTourCode').textContent = tourCode;
      document.getElementById('passengerSubtitle').textContent = `${passengerCandidates.length} sərnişin`;
      renderPassengerList();
      document.getElementById('passengerSection').style.display = 'block';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('passengerSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch {
      showToast('✕ Sunucu bağlantı hatası', 'danger');
    }
  }

  function renderPassengerList() {
    const list = document.getElementById('passengerList');
    list.innerHTML = '';
    passengerCandidates.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'card p-3 d-flex flex-row align-items-center justify-content-between';

      let badge, actionHtml = '';
      if (!p.tour_match) {
        badge = `<span title="Əvvəlcə Turlar-ı import edin" class="badge bg-secondary-subtle text-secondary-emphasis">Tur tapılmadı (${p.tour_code || '—'} / ${p.room_code || '—'} / ${p.category_name || '—'})</span>`;
      } else if (p.has_order) {
        badge = `<span class="badge bg-primary-subtle text-primary-emphasis">Sifariş var</span>`;
      } else {
        badge = p.client_match
          ? `<span class="badge bg-info-subtle text-info-emphasis">Müştəri tapıldı</span>`
          : `<span class="badge bg-warning-subtle text-warning-emphasis">Yeni müştəri</span>`;
        actionHtml = `<button data-idx="${idx}" class="passenger-action-btn btn btn-primary btn-sm">${p.client_match ? 'Sifariş Yarat' : 'Müştəri + Sifariş'}</button>`;
      }

      const cancelledTag = p.cancelled ? ` <span class="text-danger small">(İPTAL)</span>` : '';
      const discountTag = p.discount_amount > 0 ? ` <span class="badge bg-warning-subtle text-warning-emphasis">Endirim ${p.discount_amount}</span>` : '';
      const incomeTag = p.income_amount > 0 ? ` <span class="badge bg-success-subtle text-success-emphasis">Gəlir ${p.income_amount}</span>` : '';
      row.innerHTML = `
        <div>
          <p class="fw-semibold mb-0">${p.first_name} ${p.last_name}${cancelledTag}${discountTag}${incomeTag}</p>
          <p class="small text-secondary mb-0 mt-1">${p.birth_year || '—'} · ${p.room_code || '—'} / ${p.category_name || '—'} · ${p.phone || ''}</p>
        </div>
        <div class="d-flex align-items-center gap-2">${badge}${actionHtml}</div>`;

      const btn = row.querySelector('.passenger-action-btn');
      if (btn) btn.onclick = (e) => handlePassengerAction(idx, e.currentTarget);
      list.appendChild(row);
    });
  }

  function todayDdmmyyyy() {
    return isoToDdmmyyyy(new Date().toISOString().slice(0, 10));
  }

  // Bir sərnişini emal edir. Yaradılacaq məlumatlar (müştəri sahələri əskikdirsə, ya da TAHSİLAT-a görə
  // gəlir yaradılacaqsa) əvvəlcə bir önizləmə modalında göstərilir ki, istifadəçi hesab/kateqoriyanı seçib
  // təsdiqləsin. Heç nə çatışmırsa və gəlir yoxdursa, sual vermədən avtomatik yaradılır.
  // Nəticəni { status: 'ok'|'skip'|'cancel'|'error', msg } kimi qaytarır ki, həm tək düymə, həm də
  // "Hamısını Yarat" ardıcıl loop-u eyni funksiyadan istifadə edə bilsin.
  async function processPassenger(idx) {
    const p = passengerCandidates[idx];
    const who = `${p.first_name} ${p.last_name}`;

    if (!p.tour_match) return { status: 'skip', msg: `${who} — tur tapılmadı (${p.tour_code || '—'} / ${p.room_code || '—'} / ${p.category_name || '—'}), ötürüldü` };
    if (p.has_order) return { status: 'skip', msg: `${who} — artıq sifariş var` };

    const missingImportant = !p.client_match && (!p.first_name || !p.last_name || !p.birth_date);
    const needsIncomeChoice = p.income_amount > 0;

    let clientOverride = {};
    let incomeChoice = null;

    if (missingImportant || needsIncomeChoice) {
      const fields = [
        { key: 'tour_info', type: 'info', label: 'Tur', value: `${p.tour_code || '—'} · ${p.room_code || '—'} / ${p.category_name || '—'}` },
      ];
      if (p.discount_amount > 0) {
        fields.push({ key: 'discount_info', type: 'info', label: 'Endirim (Sheets İmport)', value: p.discount_amount });
      }
      if (missingImportant) {
        fields.push(
          { key: 'first_name', label: 'Ad', type: 'text', value: p.first_name },
          { key: 'last_name', label: 'Soyad', type: 'text', value: p.last_name },
          { key: 'birth_date', label: 'Doğum tarixi (GG.AA.YYYY)', type: 'text', value: isoToDdmmyyyy(p.birth_date) },
          { key: 'phone', label: 'Telefon', type: 'text', value: p.phone },
          { key: 'passport', label: 'Passport (məlumat üçün)', type: 'info', value: p.passport_no },
          { key: 'email', label: 'Email', type: 'text', value: '' },
        );
      }
      if (needsIncomeChoice) {
        const [accounts, categories] = await Promise.all([getAccountsList(), getIncomeCategoriesList()]);
        const accountOptions = accounts.map(a => ({ value: a.id, label: `${a.name} (${a.currency})` }));
        const categoryOptions = categories.map(c => ({ value: c.id, label: c.name }));
        fields.push(
          { key: 'income_amount_info', type: 'info', label: 'Gəlir (TAHSİLAT)', value: p.income_amount },
          { key: 'income_account_id', label: 'Hesab', type: 'select', options: accountOptions, value: lastIncomeAccountId ?? accountOptions[0]?.value },
          { key: 'income_category_id', label: 'Gəlir kateqoriyası', type: 'select', options: categoryOptions, value: lastIncomeCategoryId ?? categoryOptions[0]?.value },
          { key: 'income_date', label: 'Tarix (GG.AA.YYYY)', type: 'text', value: todayDdmmyyyy() },
        );
      }

      const result = await openModal({
        title: `${who} — yoxlayın və təsdiqləyin`,
        subtitle: missingImportant ? 'Vacib məlumat çatışmır — tamamlayın' : 'Yaradılacaq məlumatları yoxlayıb təsdiqləyin',
        fields,
      });
      if (!result) return { status: 'cancel', msg: `${who} — imtina edildi` };

      if (missingImportant) {
        clientOverride = {
          first_name: result.first_name, last_name: result.last_name,
          birth_date: ddmmyyyyToIso(result.birth_date), phone: result.phone, email: result.email,
        };
        if (!clientOverride.first_name || !clientOverride.last_name || !clientOverride.birth_date) {
          return { status: 'cancel', msg: `${who} — Ad/Soyad/Doğum tarixi (GG.AA.YYYY) doldurulmadı, ötürüldü` };
        }
      }
      if (needsIncomeChoice) {
        lastIncomeAccountId = result.income_account_id;
        lastIncomeCategoryId = result.income_category_id;
        incomeChoice = {
          account_id: parseInt(result.income_account_id),
          income_category_id: parseInt(result.income_category_id),
          date: ddmmyyyyToIso(result.income_date) || new Date().toISOString().slice(0, 10),
        };
      }
    }

    let clientId = p.client_match ? p.client_match.id : null;

    if (!clientId) {
      const clientPayload = {
        first_name: p.first_name, last_name: p.last_name, birth_date: p.birth_date || '', phone: p.phone, email: '',
        gender: p.gender || '', nationality: p.nationality || '', father_name: p.father_name || '', reference_name: p.reference_name || '',
        ...clientOverride,
      };

      const res = await fetch('/api/clients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(clientPayload),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        return { status: 'error', msg: `${who} — müştəri yaradıla bilmədi${err.error ? ': ' + err.error : ''}` };
      }
      const client = await res.json();
      clientId = client.id;
      p.client_match = { id: client.id, first_name: client.first_name, last_name: client.last_name };
    }

    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_id: clientId, tour_id: p.tour_match, incomes: [] }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      return { status: 'error', msg: `${who} — sifariş yaradıla bilmədi${err.error ? ': ' + err.error : ''}` };
    }
    const order = await res.json();

    p.has_order = true;
    let warnings = [];

    if (p.discount_amount > 0) {
      const catId = await getImportDiscountCategoryId();
      if (catId) {
        const discRes = await fetch(`/api/orders/${order.id}/discounts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: p.discount_amount, discount_category_id: catId }),
        });
        if (!discRes.ok) warnings.push('endirim əlavə edilmədi');
      }
    }

    if (incomeChoice) {
      const incRes = await fetch('/api/incomes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: `Sheets import — ${who}`,
          amount: p.income_amount,
          date: incomeChoice.date,
          income_category_id: incomeChoice.income_category_id,
          account_id: incomeChoice.account_id,
          tour_id: p.tour_match,
          order_id: order.id,
        }),
      });
      if (!incRes.ok) warnings.push('gəlir əlavə edilmədi');
    }

    const suffix = warnings.length ? `, ${warnings.join(', ')}` : '';
    return { status: 'ok', msg: `${who} — sifariş yaradıldı${suffix}` };
  }

  async function handlePassengerAction(idx, btn) {
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = 'Yüklənir...';

    const result = await processPassenger(idx);
    showToast((result.status === 'ok' ? '✓ ' : '✕ ') + result.msg, result.status === 'ok' ? 'success' : 'danger');

    btn.disabled = false;
    btn.textContent = originalLabel;
    renderPassengerList();
  }

  function logPassengerProgress(entry) {
    const log = document.getElementById('passengerProgressLog');
    log.style.display = 'block';
    const icon = { ok: '✓', skip: '⊘', cancel: '⊘', error: '✕' }[entry.status] || '·';
    const cls = { ok: 'text-primary', skip: 'text-secondary', cancel: 'text-secondary', error: 'text-danger' }[entry.status] || 'text-secondary';
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = `${icon} ${entry.msg}`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  async function createAllPassengers() {
    const btn = document.getElementById('passengerAllBtn');
    const label = document.getElementById('passengerAllBtnLabel');
    const log = document.getElementById('passengerProgressLog');
    log.innerHTML = '';
    log.style.display = 'block';
    btn.disabled = true;

    const total = passengerCandidates.length;
    let created = 0, skipped = 0, errors = 0;

    for (let i = 0; i < total; i++) {
      label.innerHTML = `<span class="spinner-sm"></span> ${i + 1}/${total}`;
      const result = await processPassenger(i);
      logPassengerProgress(result);
      if (result.status === 'ok') created++;
      else if (result.status === 'error') errors++;
      else skipped++;
      renderPassengerList();
    }

    btn.disabled = false;
    label.textContent = 'Hamısını Yarat';
    showToast(`✓ ${created} sifariş yaradıldı, ${skipped} ötürüldü, ${errors} xəta`, errors ? 'danger' : 'success');
  }

  function openSheet(title, headers, rows) {
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultSubtitle').textContent = `${rows.length} sətr — ${headers.length} sütun`;
    renderTable(headers, rows);
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderTable(headers, rows) {
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');
    head.innerHTML = '';
    body.innerHTML = '';

    headers.forEach(h => {
      const th = document.createElement('th');
      th.className = 'text-nowrap';
      th.textContent = h;
      head.appendChild(th);
    });

    rows.forEach(row => {
      const tr = document.createElement('tr');
      headers.forEach((_, i) => {
        const td = document.createElement('td');
        td.className = 'text-nowrap';
        td.textContent = row[i] ?? '';
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('emptyState').style.display = rows.length ? 'none' : 'block';
  }

  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'alert position-fixed d-flex align-items-center gap-2 alert-' + type;
    el.style.top = '20px';
    el.style.right = '20px';
    el.style.zIndex = 1080;
    el.style.minWidth = '260px';
    setTimeout(() => el.classList.add('d-none'), 2800);
  }
</script>
